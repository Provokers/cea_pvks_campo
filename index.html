.d0{--tint:#f4ede1;--acc:#d9c9a8}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,b,strong{text-wrap:balance}
p,li,.sub{text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 20px 32px}

#lock h1 b{font-weight:700}

.status{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759}
.off .dot{background:var(--ink3)}
h1.big{font-weight:300;font-size:40px;line-height:1.02;letter-spacing:-.03em;margin:8px 0 8px}

.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

.team span{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.team strong{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin:0 2px 18px}
.bar{flex:1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.v{display:flex;gap:14px;padding-bottom:12px}
.v .rail{display:flex;flex-direction:column;align-items:center;width:44px;flex:none}
.v .h{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:18px}
.v .h.after{font-size:11px;font-weight:500;color:var(--ink2);text-align:center;line-height:1.2}
.v .ln{flex:1;width:2px;border-radius:1px;background:var(--acc);opacity:.55;margin-top:8px}
.card{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;min-width:0;transition:opacity .2s}
.card.loja{background:var(--soft);border-color:transparent}
.card.now{border-color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card.done{opacity:.5}
.card.done h3{text-decoration:line-through;text-decoration-thickness:1px}
.chead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.kind{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);flex:1;padding-top:4px}
.kind svg{width:14px;height:14px}
.tag{background:var(--ink);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;margin-left:4px}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid #d6d3cc;display:grid;place-items:center;flex:none;background:#fff;transition:all .2s}
.chk svg{width:16px;height:16px;opacity:0;transition:opacity .2s}
.chk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.chk[aria-pressed="true"] svg{opacity:1}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.card p{margin:0;color:var(--ink2);font-size:14px;line-height:1.4}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:500;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ico{width:36px;padding:0;justify-content:center}
.btn svg{width:15px;height:15px}
.sec{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:34px 0 14px}
.sec.first{margin-top:8px}
.item{border-bottom:1px solid var(--line)}
.item summary{list-style:none;display:flex;align-items:center;gap:14px;padding:18px 0;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.ic{width:40px;height:40px;border-radius:12px;background:var(--beige);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.item summary b{font-size:16px;font-weight:600;flex:1}
.chev{width:16px;height:16px;transition:transform .25s;color:var(--ink3);flex:none}

.item .body{padding:0 0 18px 54px;color:#3a3a3c;font-size:15px;line-height:1.5}

.dd{display:grid;gap:10px}

nav button.on{color:var(--ink)}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-80px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;transition:transform .35s;z-index:60}
.toast.show{transform:translate(-50%,0)}

 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
 tick:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-9"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.6 2.6L16 9.5"/></svg>',
 no:'<svg viewBox="0 0 24 24" fill="none" stroke="#a3855a" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
};
let D=null,day=0,chosen=false,CUR=[];
let done={};try{done=JSON.parse(store.get('cea_done')||'{}')||{}}catch(_){done={}}

async function sha(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  return s==='PVKS2026!'?HASH:'';
}
function unlock(){const l=$('#lock');if(l)l.remove();$('#shell').hidden=false;load()}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();
  if(await sha($('#pw').value)===HASH){store.set('cea_ok',HASH);unlock()}
  else{$('#err').textContent='Senha incorreta';$('#pw').select()}});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function net(){const on=navigator.onLine;$('#st').classList.toggle('off',!on);$('#stt').textContent=on?'Online':'Offline · dados salvos'}
addEventListener('online',()=>{net();load()});addEventListener('offline',net);
async function load(){
  net();
  let cached=store.get('cea_data');try{cached=cached?JSON.parse(cached):null;if(cached&&!cached.pracas)cached=null}catch(_){cached=null}
  if(!D){D=(cached&&FALLBACK&&cached.versao<FALLBACK.versao)?FALLBACK:(cached||FALLBACK);if(D)render()}
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const n=await r.json();
    if(!D||n.versao!==D.versao){const had=!!D;D=n;store.set('cea_data',JSON.stringify(n));render();if(had)toast('Informações atualizadas')}
  }catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D)load()});

/* endereço limpo para mapas e Uber: troca "·" por vírgula, usa a 1ª opção quando há "ou", soma a cidade */
function addr(v){const c=(D.pracas[0].cidade||'São Paulo - SP');return String(v.endereco).split(/\s+ou\s+/i)[0].replace(/\s*·\s*/g,', ')+', '+c}
const hasGeo=v=>typeof v.lat==='number'&&typeof v.lng==='number';
function mapsUrl(v){
  const a=encodeURIComponent(addr(v));
  if(IOS) return hasGeo(v)?`https://maps.apple.com/?ll=${v.lat},${v.lng}&q=${encodeURIComponent(v.nome)}`:`https://maps.apple.com/?q=${a}`;
  if(ANDROID) return hasGeo(v)?`geo:${v.lat},${v.lng}?q=${v.lat},${v.lng}(${encodeURIComponent(v.nome)})`:`geo:0,0?q=${a}`;
  return `https://www.google.com/maps/search/?api=1&query=${a}`;
}
function uberParams(v){
  const p=['action=setPickup','pickup=my_location','dropoff[formatted_address]='+encodeURIComponent(addr(v)),'dropoff[nickname]='+encodeURIComponent(v.nome)];
  if(hasGeo(v))p.push('dropoff[latitude]='+v.lat,'dropoff[longitude]='+v.lng);
  return p.join('&');
}
function openUber(v){
  const q=uberParams(v), web='https://m.uber.com/ul/?'+q;
  if(!(IOS||ANDROID)){window.open(web,'_blank','noopener');return}
  // tenta o app; se não estiver instalado, cai no link universal
  let left=false;const onHide=()=>{left=true};
  document.addEventListener('visibilitychange',onHide,{once:true});
  location.href='uber://?'+q;
  setTimeout(()=>{if(!left&&!document.hidden)location.href=web},1400);
}
const P=k=>(D.pessoas&&D.pessoas[k])||{nome:k,cor:'#111'};
const who=k=>`<span class="pdot" style="background:${esc(P(k).cor)}"></span>${esc(k)}`;

function render(){try{renderAll()}catch(e){console.error(e);if(FALLBACK&&D!==FALLBACK){D=FALLBACK;try{renderAll()}catch(_){}}}}
function renderAll(){
  const p=D.pracas[0], today=todayStr();
  $('#psub').innerHTML=nb(p.nome+' · '+p.periodo+' · '+p.resumo);
  $('#notices').innerHTML=(D.avisos||[]).map(a=>'<div class="notice">'+nb(a)+'</div>').join('');
  if(!chosen){const ti=p.dias.findIndex(d=>d.data===today);if(ti>=0)day=ti}
  if(day>=p.dias.length)day=0;
  $('#days').innerHTML=p.dias.map((d,i)=>`<button type="button" role="tab" aria-selected="${i===day}" class="d${i%3} ${i===day?'on':''}" data-i="${i}">${esc(d.titulo)}<small>${fmtDay(d.data)}</small><span class="sw"></span></button>`).join('');
  $('#days').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{day=+b.dataset.i;chosen=true;render()}));
  const d=p.dias[day];CUR=d.visitas;
  $('#day').className='d'+(day%3);
  $('#team').innerHTML=`<div><span>Moderação</span><strong>${who(d.moderacao)}</strong></div><div><span>Acompanha</span><strong>${who(d.acompanha)}</strong></div><div><span>Locomoção</span><strong>${esc(d.transporte)}</strong></div>`;
  const key=i=>d.data+'#'+i;
  const total=d.visitas.length, feitos=d.visitas.filter((_,i)=>done[key(i)]).length;
  $('#prog').innerHTML=`<span>${feitos} de ${total} visitas</span><span class="bar"><i style="width:${total?feitos/total*100:0}%"></i></span>`;
  const nowIdx=d.data===today?d.visitas.findIndex((_,i)=>!done[key(i)]):-1;
  $('#tl').innerHTML=d.visitas.map((v,i)=>{
    const after=!/^\d/.test(v.hora), last=i===total-1, isDone=!!done[key(i)];
    return `<div class="v"><div class="rail"><div class="h ${after?'after':''}">${after?'depois':esc(v.hora)}</div>${last?'':'<div class="ln"></div>'}</div>
    <div class="card ${v.tipo} ${i===nowIdx?'now':''} ${isDone?'done':''}">
      <div class="chead"><div class="kind">${v.tipo==='casa'?I.home+'Etnografia em casa':I.bag+'Visita à loja'}${i===nowIdx?'<span class="tag">Agora</span>':''}</div>
      <button type="button" class="chk" data-k="${esc(key(i))}" aria-pressed="${isDone}" aria-label="Marcar ${esc(v.nome)} como visitada">${I.tick}</button></div>
      <h3>${nb(v.nome)}</h3><p>${nb(v.endereco)}</p>
      <div class="acts"><a class="btn" href="${esc(mapsUrl(v))}" ${IOS||ANDROID?'':'target="_blank" rel="noopener"'}>${I.pin}Mapa</a><button type="button" class="btn ghost uber" data-i="${i}">${I.car}Uber</button></div>
    </div></div>`}).join('');
  $('#tl').querySelectorAll('.chk').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(done[k])delete done[k];else done[k]=1;store.set('cea_done',JSON.stringify(done));render()}));
  $('#tl').querySelectorAll('.uber').forEach(b=>b.addEventListener('click',()=>openUber(CUR[+b.dataset.i])));
  $('#manual').innerHTML='<h2 class="sec first">Antes de&nbsp;entrar</h2>'+D.manual.map((m,i)=>`<details class="item" ${i===0?'open':''}><summary><span class="ic">${I[m.icone]||I.question}</span><b>${nb(m.titulo)}</b>${I.chev}</summary><div class="body">${m.texto.map(t=>'<p>'+nb(t)+'</p>').join('')}</div></details>`).join('');
  $('#dd').innerHTML=`<div class="col do"><h4>Pode</h4><ul>${D.dos.map(t=>'<li>'+I.ok+'<span>'+nb(t)+'</span></li>').join('')}</ul></div><div class="col dont"><h4>Evite</h4><ul>${D.donts.map(t=>'<li>'+I.no+'<span>'+nb(t)+'</span></li>').join('')}</ul></div>`;
  $('#cts').innerHTML=D.contatos.map(c=>{const ini=c.nome.split(' ').map(x=>x[0]).slice(0,2).join('');const cor=c.pessoa?P(c.pessoa).cor:'#111';
    return `<div class="ct"><div class="av" style="background:${esc(cor)}">${esc(ini)}</div><div style="flex:1;min-width:0"><h3>${esc(c.nome)}</h3><p>${nb(c.papel)}</p>
    <div class="ln2">${esc(c.telFmt)}</div><div class="ln2" style="color:var(--ink2)">${esc(c.email)}</div>
    <div class="acts">${c.tel?`<a class="btn" href="tel:${esc(c.tel)}">${I.phone}Ligar</a><a class="btn ghost" href="https://wa.me/${esc(c.tel.replace(/\D/g,''))}" target="_blank" rel="noopener">${I.wa}WhatsApp</a>`:''}<a class="btn ghost ico" href="mailto:${esc(c.email)}" aria-label="E-mail">${I.mail}</a></div></div></div>`}).join('');
  $('#legend').innerHTML=Object.keys(D.pessoas||{}).map(k=>`<span><span class="pdot" style="background:${esc(P(k).cor)}"></span>${esc(k)} · ${esc(P(k).papel||'')}</span>`).join('');
  $('#ver').textContent='Atualizado em '+D.versao;
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  $('#scroll').scrollTo({top:0,behavior:'smooth'});
}));
if(store.get('cea_ok')===HASH) unlock();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
